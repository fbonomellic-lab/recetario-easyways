name: Revisar nuevas recetas EasyWays

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: write

concurrency:
  group: easyways-recipe-index
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descubrir fichas oficiales
        run: python scripts/discover_recipes.py
      - name: Extraer ingredientes publicados en fichas estructuradas
        run: python scripts/enrich_recipes.py
      - name: Guardar novedades si las hay
        run: |
          if git diff --quiet -- data/discovered_recipes.json data/enriched_recipes.json && [ -z "$(git ls-files --others --exclude-standard data/discovered_recipes.json data/enriched_recipes.json)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovered_recipes.json data/enriched_recipes.json
          git commit -m "Actualizar índice de recetas detectadas"
          git push
